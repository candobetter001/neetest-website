<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="color-scheme" content="light only" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — NEETest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="assets/css/main.css?v=3" />
</head>
<body>
  <div id="nav-slot"></div>

  <main>
    <section class="relative overflow-hidden py-12 md:py-20">
      <div class="mesh-bg"></div>
      <div class="relative max-w-md mx-auto px-4 md:px-6">

        <!-- Step 1: Gmail entry -->
        <div id="step-email" class="p-8 rounded-3xl border border-[var(--border)] bg-white shadow-xl">
          <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl mb-3" style="background:linear-gradient(135deg,#4f46e5,#06b6d4)">
              <i data-lucide="user-plus" class="w-7 h-7 text-white"></i>
            </div>
            <h1 class="font-display text-2xl font-bold">Sign in to NEETest</h1>
            <p class="text-sm text-[var(--text-muted)] mt-1">Enter your Gmail to receive a one-time code.</p>
          </div>
          <form id="email-form" class="space-y-4">
            <div>
              <label class="text-xs font-semibold text-[var(--text-muted)] uppercase tracking-wider">Your Gmail</label>
              <input id="email-input" type="email" required pattern=".*@(gmail\.com|googlemail\.com)$" placeholder="you@gmail.com"
                class="mt-1 w-full px-4 py-3 rounded-xl border border-[var(--border)] outline-none focus:border-[var(--primary)] text-base" />
              <p class="text-xs text-[var(--text-muted)] mt-1">We use Gmail addresses only.</p>
            </div>
            <div>
              <label class="text-xs font-semibold text-[var(--text-muted)] uppercase tracking-wider">Your name</label>
              <input id="name-input" type="text" required placeholder="Dr. Aspirant"
                class="mt-1 w-full px-4 py-3 rounded-xl border border-[var(--border)] outline-none focus:border-[var(--primary)] text-base" />
            </div>
            <button class="btn-primary w-full justify-center magnetic" type="submit">
              <i data-lucide="mail" class="w-5 h-5"></i>Send OTP
            </button>
          </form>
          <p class="text-center text-xs text-[var(--text-muted)] mt-6">
            By signing in you accept our <a href="terms.html" class="underline">Terms &amp; Conditions</a> and <a href="terms.html#privacy" class="underline">Privacy Policy</a>.
          </p>
        </div>

        <!-- Step 2: OTP -->
        <div id="step-otp" class="hidden p-8 rounded-3xl border border-[var(--border)] bg-white shadow-xl">
          <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl mb-3 bg-emerald-100 text-emerald-600">
              <i data-lucide="shield-check" class="w-7 h-7"></i>
            </div>
            <h1 class="font-display text-2xl font-bold">Enter the 6-digit code</h1>
            <p class="text-sm text-[var(--text-muted)] mt-1">We&#39;d send this to <span id="display-email" class="font-semibold text-[var(--text)]"></span></p>
          </div>

          <form id="otp-form" class="space-y-4">
            <div>
              <label class="text-xs font-semibold text-[var(--text-muted)] uppercase tracking-wider">One-time code</label>
              <input id="otp-input" type="text" inputmode="numeric" pattern="\d{6}" maxlength="6" required placeholder="------"
                class="mt-1 w-full px-4 py-3 rounded-xl border border-[var(--border)] outline-none focus:border-[var(--primary)] text-2xl font-mono tracking-widest text-center" autocomplete="one-time-code" />
            </div>
            <button class="btn-primary w-full justify-center magnetic" type="submit">
              <i data-lucide="check" class="w-5 h-5"></i>Verify &amp; sign in
            </button>
            <button type="button" id="back-btn" class="btn-secondary w-full justify-center">
              <i data-lucide="arrow-left" class="w-4 h-4"></i>Use a different email
            </button>
          </form>
        </div>

        <!-- Step 3: Done -->
        <div id="step-done" class="hidden p-8 rounded-3xl border-2 border-emerald-500 bg-emerald-50">
          <div class="text-center">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl mb-3 bg-emerald-500 text-white">
              <i data-lucide="check" class="w-7 h-7"></i>
            </div>
            <h1 class="font-display text-2xl font-bold text-emerald-900">You're signed in!</h1>
            <p class="text-sm text-emerald-800 mt-1">Redirecting you to your dashboard&hellip;</p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="footer-slot"></div>
  <script src="assets/js/data.js?v=3"></script>
  <script src="assets/js/main.js?v=3"></script>
  <script>
    renderNav('login.html');
    renderFooter();

    let pendingEmail = '', pendingName = '', localOtp = '';
    const USING_BACKEND = !!window.NEETEST_OTP_ENDPOINT;

    function generateOtp() {
      let s = '';
      for (let i = 0; i < 6; i++) s += Math.floor(Math.random() * 10);
      return s;
    }

    async function sendOtp(email) {
      if (!USING_BACKEND) {
        // Dev fallback: generate locally
        localOtp = generateOtp();
        return { ok: true, mode: 'local' };
      }
      try {
        const resp = await fetch(window.NEETEST_OTP_ENDPOINT + '/otp/send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
        });
        const data = await resp.json();
        return { ok: resp.ok && data.ok, mode: 'backend', error: data.error };
      } catch (e) {
        return { ok: false, mode: 'backend', error: 'Network error: ' + e.message };
      }
    }

    async function verifyOtp(email, otp) {
      if (!USING_BACKEND) {
        return { ok: otp === localOtp, reason: otp === localOtp ? null : 'mismatch' };
      }
      try {
        const resp = await fetch(window.NEETEST_OTP_ENDPOINT + '/otp/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, otp }),
        });
        return await resp.json();
      } catch (e) {
        return { ok: false, reason: 'network: ' + e.message };
      }
    }

    document.getElementById('email-form').addEventListener('submit', async e => {
      e.preventDefault();
      const submitBtn = e.target.querySelector('button[type=submit]');
      submitBtn.disabled = true; submitBtn.textContent = 'Sending...';
      const email = document.getElementById('email-input').value.trim().toLowerCase();
      const name = document.getElementById('name-input').value.trim();
      if (!email.endsWith('@gmail.com') && !email.endsWith('@googlemail.com')) {
        alert('Please use a Gmail address.');
        submitBtn.disabled = false; submitBtn.innerHTML = '<i data-lucide="mail" class="w-5 h-5"></i>Send OTP'; refreshIcons();
        return;
      }
      pendingEmail = email;
      pendingName = name;
      const result = await sendOtp(email);
      submitBtn.disabled = false; submitBtn.innerHTML = '<i data-lucide="mail" class="w-5 h-5"></i>Send OTP'; refreshIcons();
      if (!result.ok) {
        alert(result.error || 'Could not send code. Please try again.');
        return;
      }
      document.getElementById('display-email').textContent = email;
      document.getElementById('step-email').classList.add('hidden');
      document.getElementById('step-otp').classList.remove('hidden');
      refreshIcons();
    });
    document.getElementById('back-btn').addEventListener('click', () => {
      document.getElementById('step-otp').classList.add('hidden');
      document.getElementById('step-email').classList.remove('hidden');
    });
    document.getElementById('otp-form').addEventListener('submit', async e => {
      e.preventDefault();
      const otp = document.getElementById('otp-input').value.trim();
      if (!/^\d{6}$/.test(otp)) { alert('Enter exactly 6 digits.'); return; }
      const submitBtn = e.target.querySelector('button[type=submit]');
      submitBtn.disabled = true; submitBtn.textContent = 'Verifying...';
      const result = await verifyOtp(pendingEmail, otp);
      submitBtn.disabled = false; submitBtn.innerHTML = '<i data-lucide="check" class="w-5 h-5"></i>Verify &amp; sign in'; refreshIcons();
      if (!result.ok) {
        alert('Code does not match. ' + (result.remaining != null ? result.remaining + ' attempts remaining.' : ''));
        return;
      }
      NEETEST_AUTH.login(pendingEmail, pendingName);

      // Log registration to backend (fire-and-forget, for GST records)
      if (window.NEETEST_OTP_ENDPOINT) {
        fetch(window.NEETEST_OTP_ENDPOINT + '/student/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: pendingEmail, name: pendingName, source: 'web' }),
        }).catch(() => {});
      }

      document.getElementById('step-otp').classList.add('hidden');
      document.getElementById('step-done').classList.remove('hidden');
      refreshIcons();
      const params = new URLSearchParams(location.search);
      const redirect = params.get('redirect') || 'profile.html';
      setTimeout(() => { location.href = redirect; }, 1500);
    });
    refreshIcons();
    initMagnetic();
  </script>
</body>
</html>
